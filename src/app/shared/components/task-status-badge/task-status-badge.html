<span class="inline-flex items-center gap-1 text-xs px-2 py-0.5 rounded-full whitespace-nowrap" [ngClass]="{
        'bg-gray-100 text-gray-700': status() === 'En attente',
        'bg-blue-100 text-blue-800': status() === 'En cours',
        'bg-green-100 text-green-800': status() === 'Terminé'
    }">
    <span class="w-1.5 h-1.5 rounded-full" [ngClass]="{
            'bg-gray-400': status() === 'En attente',
            'bg-blue-500': status() === 'En cours',
            'bg-green-500': status() === 'Terminé'
        }"></span>
    {{ status() }}
</span>
