<div class="bg-white shadow rounded-lg p-4 space-y-3">
    <div class="flex items-start justify-between">
        <div>
            <h2 class="text-lg font-semibold">{{ user().name }}</h2>
            <p class="text-sm text-gray-600">{{ user().email }}</p>
            <p class="text-xs text-gray-500">{{ user().role }}</p>
        </div>
        @if (user().active) {
        <span class="text-xs px-2 py-1 rounded-full bg-green-100 text-green-800">Actif</span>
        } @else {
        <span class="text-xs px-2 py-1 rounded-full bg-red-100 text-red-800">Inactif</span>
        }
    </div>

    <div class="grid grid-cols-3 gap-2 text-center text-sm">
        <div class="rounded bg-gray-100 p-2">
            <p class="font-bold">{{ todoCount() }}</p>
            <p class="text-xs">À faire</p>
        </div>
        <div class="rounded bg-blue-100 p-2">
            <p class="font-bold">{{ inProgressCount() }}</p>
            <p class="text-xs">En cours</p>
        </div>
        <div class="rounded bg-green-100 p-2">
            <p class="font-bold">{{ doneCount() }}</p>
            <p class="text-xs">Terminées</p>
        </div>
    </div>

    @for (group of groups(); track group.projectId) {
    <app-user-project-group [projectName]="group.projectName" [tasks]="group.tasks" />
    } @empty {
    <app-empty-state message="Aucune tâche assignée" />
    }
</div>
