<div class="max-w-5xl mx-auto p-6 space-y-4">
    <input type="text" placeholder="Rechercher un utilisateur..." [ngModel]="searchTerm()"
        (ngModelChange)="searchTerm.set($event)" class="w-full border rounded px-3 py-2" />

    <div class="grid gap-4 md:grid-cols-2 lg:grid-cols-3">
        @for (user of filteredUsers(); track user.id) {
        <app-user-card [user]="user" [projects]="projects()" />
        } @empty {
        <div class="col-span-full">
            <app-empty-state message="Aucun utilisateur ne correspond à la recherche." />
        </div>
        }
    </div>
</div>
