<ul class="space-y-2">
    <!-- Partie 2.2 : @for + track sur l'identifiant unique de la tâche -->
    @for (task of tasks(); track task.id) {
    <li>
        <app-task-item [task]="task" [showAssignee]="showAssignee()" [assigneeName]="assigneeName(task.assigneeId)"
            [canChangeStatus]="canChangeStatus()" (taskStatusChange)="onTaskStatusChange(task.id, $event)" />
    </li>
    } @empty {
    <!-- Partie 2.3 -->
    <li class="text-sm italic text-gray-500">Aucune tâche</li>
    }
</ul>
